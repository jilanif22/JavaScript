<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imgur Gallery</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .image-card { border: 1px solid #ddd; padding: 10px; border-radius: 8px; cursor: pointer; }
        .image-card img { width: 100%; height: auto; border-radius: 5px; }
        .comments { margin-top: 20px; padding: 10px; border: 1px solid #ccc; background: #f9f9f9; display: none; }
    </style>
</head>
<body style="background-color: #D3D3D3;">
<center>
    <h1>Imgur Gallery</h1>
    <div id="gallery" class="gallery"></div>
    <div id="comments" class="comments"></div>
    
</center>

    <script src="ImgurGallery.js"></script>

</body>
</html>
