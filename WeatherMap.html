<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Times New Roman, sans-serif;
            text-align: center;
            margin: 40px;
            background-color: #f4f4f4;
        }

        .container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 80%;
            margin: auto;
            gap: 40px;
        }

        .left-column {
            width: 30%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .right-column {
            width: 60%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input {
            padding: 10px;
            width: 100%;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px;
            cursor: pointer;
            background: #0078D4;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
        }

        .weather-item {
            margin: 15px 0;
            text-align: left;
            padding: 10px;
            background: #e0f7fa;
            border-radius: 5px;
        }

        .weather-item img {
            width: 50px;
            height: 50px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-column">
            <h2>Weather Forecast</h2>
            <input type="text" id="zipcode" placeholder="Enter ZIP Code">
            <button id="getWeather">Get Weather</button>
        </div>
        <div class="right-column">
            <div id="weatherResults"></div>
        </div>
    </div>
    <script src="WeatherMap.js"></script>
</body>
</html>
